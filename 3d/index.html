<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Aquarium</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0a1628; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(3,8,18,0.55) 100%);
  }
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    padding: 8px 18px; border-radius: 999px; pointer-events: none;
    font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.04em; color: rgba(205, 232, 255, 0.85);
    background: rgba(10, 22, 40, 0.5); backdrop-filter: blur(6px);
    transition: opacity 1.6s ease;
  }
  #hint.hidden { opacity: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="vignette"></div>
<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   Constants & helpers
   ============================================================ */
const TANK_W = 6, TANK_H = 4, TANK_D = 3, GLASS_T = 0.1;
const IN_X = TANK_W / 2 - GLASS_T;          // interior half extents
const IN_Z = TANK_D / 2 - GLASS_T;
const WATER_Y = 3.6;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20240607);
const rr = (a, b) => a + (b - a) * rand();
const clamp = THREE.MathUtils.clamp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const timeU = { value: 0 };   // shared time uniform

/* ============================================================
   Renderer / scene / camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Deep-ocean gradient background (generated procedurally on a canvas)
(function makeBackground() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#1a3a5c');
  gr.addColorStop(1, '#0a1628');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
})();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.0, 4.0, 8.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.62;
{
  const m = /cam=([-\d.,]+)/.exec(location.hash);
  if (m) { const v = m[1].split(',').map(Number); if (v.length === 6) { camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); } }
}
controls.update();

// Procedural environment map for glass / glossy reflections (no external files)
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

/* ============================================================
   Lighting
   ============================================================ */
scene.add(new THREE.AmbientLight(0xb3e5fc, 0.75));

const sun = new THREE.DirectionalLight(0xfff8e1, 1.9);
sun.position.set(4, 10, 7);
sun.target.position.set(0, 1.5, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5;   sun.shadow.camera.bottom = -5;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 25;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 4;
scene.add(sun, sun.target);

const lamp = new THREE.PointLight(0xffe0b2, 16, 12, 2);
lamp.position.set(0, 3.4, 0);
scene.add(lamp);

/* ============================================================
   Caustics injected into standard materials
   ============================================================ */
const CAUSTIC_GLSL = /* glsl */`
float causticPattern(vec3 wp) {
  vec2 p = wp.xz * 2.4 - 250.0;
  float t = uCTime * 0.45 + 23.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  float v = pow(abs(c), 8.0);
  return clamp(v, 0.0, 1.0) * (1.0 - smoothstep(0.3, 3.7, wp.y));
}`;

function addCaustics(mat, strength = 0.5) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uCTime = timeU;
    shader.uniforms.uCStr = { value: strength };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vCPos;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        #ifdef USE_INSTANCING
          vCPos = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
        #else
          vCPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
        #endif`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vCPos;\nuniform float uCTime;\nuniform float uCStr;\n' + CAUSTIC_GLSL)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += vec3(0.55, 0.85, 1.0) * diffuseColor.rgb * causticPattern(vCPos) * uCStr;`);
  };
}

/* ============================================================
   Glass tank (5 panels), frame, edge glints
   ============================================================ */
const tank = new THREE.Group();
scene.add(tank);

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xe0f7fa,
  metalness: 0,
  roughness: 0.05,
  transmission: 0.95,
  thickness: 0.15,
  ior: 1.5,
  transparent: true,
  opacity: 0.18,
  envMapIntensity: 2.5,
  specularIntensity: 1,
  depthWrite: false,
});

function glassPanel(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassMat);
  m.position.set(x, y, z);
  m.renderOrder = 8;
  tank.add(m);
  return m;
}
glassPanel(TANK_W, GLASS_T, TANK_D, 0, -GLASS_T / 2, 0);                                            // bottom
glassPanel(TANK_W - 2 * GLASS_T, TANK_H, GLASS_T, 0, TANK_H / 2, TANK_D / 2 - GLASS_T / 2);          // front
glassPanel(TANK_W - 2 * GLASS_T, TANK_H, GLASS_T, 0, TANK_H / 2, -TANK_D / 2 + GLASS_T / 2);         // back
glassPanel(GLASS_T, TANK_H, TANK_D, TANK_W / 2 - GLASS_T / 2, TANK_H / 2, 0);                        // right
glassPanel(GLASS_T, TANK_H, TANK_D, -TANK_W / 2 + GLASS_T / 2, TANK_H / 2, 0);                       // left

// Dark walnut rim on top + matte base trim
const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a1a12, roughness: 0.55, metalness: 0.05, envMapIntensity: 0.4 });
function frameBox(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
  m.position.set(x, y, z);
  m.receiveShadow = true;
  tank.add(m);
}
const rimY = TANK_H + 0.02, rimW = 0.24;
frameBox(TANK_W + 0.2, 0.14, rimW, 0, rimY, TANK_D / 2 - rimW / 2 + 0.05);
frameBox(TANK_W + 0.2, 0.14, rimW, 0, rimY, -TANK_D / 2 + rimW / 2 - 0.05);
frameBox(rimW, 0.14, TANK_D - 2 * rimW + 0.1, TANK_W / 2 - rimW / 2 + 0.05, rimY, 0);
frameBox(rimW, 0.14, TANK_D - 2 * rimW + 0.1, -TANK_W / 2 + rimW / 2 - 0.05, rimY, 0);
frameBox(TANK_W + 0.2, 0.14, TANK_D + 0.2, 0, -GLASS_T - 0.07, 0);

// Faint aqua glints along the glass edges
const edgeMat = new THREE.MeshBasicMaterial({
  color: 0x7fe0d0, transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending,
});
function edge(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), edgeMat);
  m.position.set(x, y, z); m.renderOrder = 9; tank.add(m);
}
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  edge(0.035, TANK_H, 0.035, sx * (TANK_W / 2 - 0.01), TANK_H / 2, sz * (TANK_D / 2 - 0.01));
}
for (const sz of [-1, 1]) edge(TANK_W, 0.035, 0.035, 0, 0.005, sz * (TANK_D / 2 - 0.01));
for (const sx of [-1, 1]) edge(0.035, 0.035, TANK_D, sx * (TANK_W / 2 - 0.01), 0.005, 0);

/* ============================================================
   Water: tinted volume (open top) + rippling surface
   ============================================================ */
function boxWithoutTop(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d);
  const idx = g.index.array, keep = [];
  for (const grp of g.groups) {
    if (grp.materialIndex === 2) continue;   // +Y face
    for (let i = grp.start; i < grp.start + grp.count; i++) keep.push(idx[i]);
  }
  g.setIndex(keep);
  g.clearGroups();
  return g;
}
const waterBody = new THREE.Mesh(
  boxWithoutTop(TANK_W - 2 * GLASS_T - 0.02, WATER_Y, TANK_D - 2 * GLASS_T - 0.02),
  new THREE.MeshBasicMaterial({ color: 0x1e88e5, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide })
);
waterBody.position.y = WATER_Y / 2;
waterBody.renderOrder = 10;
scene.add(waterBody);

const surfGeo = new THREE.PlaneGeometry(TANK_W - 2 * GLASS_T - 0.02, TANK_D - 2 * GLASS_T - 0.02, 96, 48);
surfGeo.rotateX(-Math.PI / 2);
const surfMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  uniforms: { uTime: timeU },
  vertexShader: /* glsl */`
    uniform float uTime;
    varying vec3 vN; varying vec3 vWorld;
    float h(vec2 p) {
      return 0.022 * sin(p.x * 2.1 + uTime * 1.1)
           + 0.018 * sin(p.y * 2.9 - uTime * 0.9)
           + 0.010 * sin((p.x + p.y) * 4.3 + uTime * 1.7)
           + 0.006 * sin((p.x - p.y * 1.7) * 7.1 - uTime * 2.3);
    }
    void main() {
      vec3 p = position;
      float e = 0.02;
      vec3 n = normalize(vec3(h(p.xz - vec2(e, 0.)) - h(p.xz + vec2(e, 0.)), 2.0 * e, h(p.xz - vec2(0., e)) - h(p.xz + vec2(0., e))));
      p.y += h(p.xz);
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorld = wp.xyz;
      vN = normalize(mat3(modelMatrix) * n);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vN; varying vec3 vWorld;
    void main() {
      vec3 V = normalize(cameraPosition - vWorld);
      vec3 N = normalize(vN);
      if (!gl_FrontFacing) N = -N;
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 base = vec3(0.08, 0.36, 0.72);
      vec3 sky  = vec3(0.65, 0.85, 1.0);
      vec3 col = mix(base, sky, fres * 0.75);
      vec3 L = normalize(vec3(0.4, 1.0, 0.7));
      float spec = pow(max(dot(N, normalize(L + V)), 0.0), 140.0);
      col += spec * vec3(1.0, 0.97, 0.9);
      float a = 0.16 + fres * 0.45 + spec * 0.6;
      gl_FragColor = vec4(col, clamp(a, 0.0, 0.95));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const waterSurface = new THREE.Mesh(surfGeo, surfMat);
waterSurface.position.y = WATER_Y;
waterSurface.renderOrder = 11;
scene.add(waterSurface);

/* ============================================================
   Sand bed, stones, pebbles
   ============================================================ */
function terrain(x, z) {
  return 0.2
    + 0.10 * (0.5 - z / (2 * IN_Z))
    + 0.045 * Math.sin(x * 1.3 + 1.0) * Math.cos(z * 1.7)
    + 0.025 * Math.sin(x * 3.1 + z * 1.3) * Math.sin(z * 2.3);
}

const sandGeo = new THREE.PlaneGeometry(2 * IN_X - 0.05, 2 * IN_Z - 0.05, 120, 60);
sandGeo.rotateX(-Math.PI / 2);
{
  const pos = sandGeo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const c1 = new THREE.Color(0xa88c60), c2 = new THREE.Color(0x7d6746), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrain(x, z) + (rand() - 0.5) * 0.008);
    c.copy(c1).lerp(c2, clamp(0.5 + 0.5 * Math.sin(x * 5.0) * Math.sin(z * 4.3) + (rand() - 0.5) * 0.5, 0, 1));
    cols.set([c.r, c.g, c.b], i * 3);
  }
  sandGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  sandGeo.computeVertexNormals();
}
const sandMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, envMapIntensity: 0.15 });
addCaustics(sandMat, 2.6);
const sand = new THREE.Mesh(sandGeo, sandMat);
sand.receiveShadow = true;
scene.add(sand);

// skirt: drop the bed's four edges down to the glass floor
{
  const w = 2 * IN_X - 0.05, d = 2 * IN_Z - 0.05, nx = 120, nz = 60;
  const pos = [], col = [], idx = [];
  const c = new THREE.Color(0x7d6746);
  const edgeLoop = [];
  for (let i = 0; i <= nx; i++) edgeLoop.push([-w / 2 + w * i / nx,  d / 2, 0, 1]);   // front
  for (let k = 1; k <= nz; k++) edgeLoop.push([ w / 2,  d / 2 - d * k / nz, 1, 0]);   // right
  for (let i = 1; i <= nx; i++) edgeLoop.push([ w / 2 - w * i / nx, -d / 2, 0, -1]);  // back
  for (let k = 1; k <= nz; k++) edgeLoop.push([-w / 2, -d / 2 + d * k / nz, -1, 0]);  // left
  const nrm = [];
  edgeLoop.forEach(([x, z, nxv, nzv]) => {
    pos.push(x, terrain(x, z), z, x, 0, z);
    col.push(c.r, c.g, c.b, c.r * 0.7, c.g * 0.7, c.b * 0.7);
    nrm.push(nxv, 0, nzv, nxv, 0, nzv);
  });
  for (let i = 0; i < edgeLoop.length - 1; i++) {
    const a = i * 2, b = a + 1, cc = a + 2, dd = a + 3;
    // skip the corner seams (normal changes) to avoid twisted quads
    const same = edgeLoop[i][2] === edgeLoop[i + 1][2] && edgeLoop[i][3] === edgeLoop[i + 1][3];
    if (!same) continue;
    idx.push(a, b, cc, b, dd, cc);   // material is double-sided, winding is irrelevant
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setIndex(idx);
  const skirt = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x6f5b3f, side: THREE.DoubleSide }));
    scene.add(skirt);
}

/* ============================================================
   Rocks, driftwood, pot, shells, gravel
   ============================================================ */
const obstacles = [];    // {x,z,r}  things crawlers steer around
const stoneBumps = [];   // ellipsoid approximations, used for ground height
const hideSpots = [];    // {x,y,z}  little refuges for fish and crawlers
const bigRocks = [];     // {x,z,top,r}  places fish like to hang around

function groundY(x, z) {
  let h = terrain(x, z);
  for (const s of stoneBumps) {
    const dx = x - s.x, dz = z - s.z;
    const c = Math.cos(s.rot), sn = Math.sin(s.rot);
    const lx = (c * dx - sn * dz) / s.sx, lz = (sn * dx + c * dz) / s.sz;
    const q = lx * lx + lz * lz;
    if (q < 1) h = Math.max(h, s.base + (s.top - s.base) * Math.pow(1 - q, 0.4));
  }
  return h;
}

const stonePalette = [0x8D6E63, 0xA1887F, 0x9E9E9E, 0x6D4C41].map(h => new THREE.Color(h));
const stoneMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, envMapIntensity: 0.25 });
addCaustics(stoneMat, 0.8);

function makeStoneGeometry(seed, tint) {
  let g = new THREE.SphereGeometry(1, 22, 16);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position;
  const cols = new Float32Array(p.count * 3);
  const col = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 + 0.16 * Math.sin(x * 2.7 + seed) * Math.sin(y * 2.3 + seed * 1.7)
                + 0.10 * Math.sin(z * 3.9 + seed * 0.6) * Math.cos(x * 3.3 - seed)
                + 0.03 * Math.sin((x + y + z) * 9.0 + seed);
    p.setXYZ(i, x * k, y * k, z * k);
    const v = 0.85 + 0.25 * (0.5 + 0.5 * Math.sin(x * 6 + z * 5 + seed * 3)) + (y > 0 ? 0.06 : -0.06);
    col.copy(tint).multiplyScalar(v);
    cols.set([col.r, col.g, col.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  return g;
}

/** Adds a stone. s scales the random proportions; o.sx/sy/sz give explicit half-extents (times s). */
function addStone(x, z, s, o = {}) {
  const tint = (o.tint || stonePalette[Math.floor(rand() * stonePalette.length)]).clone().offsetHSL(0, 0, (rand() - 0.5) * 0.08);
  const m = new THREE.Mesh(makeStoneGeometry(rand() * 100, tint), stoneMat);
  const sx = s * (o.sx ?? rr(0.9, 1.3)), sy = s * (o.sy ?? rr(0.45, 0.65)), sz = s * (o.sz ?? rr(0.8, 1.15));
  const base = terrain(x, z);
  const yc = o.y ?? base + sy * 0.35;
  m.scale.set(sx, sy, sz);
  m.rotation.y = o.rot ?? rand() * Math.PI * 2;
  m.position.set(x, yc, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  const r = Math.max(sx, sz);
  if (!o.overhang) {
    stoneBumps.push({ x, z, sx: sx * 0.95, sz: sz * 0.95, rot: m.rotation.y, base, top: yc + sy * 0.9 });
    if (r >= 0.14) obstacles.push({ x, z, r: r * 0.85 });
    if (r >= 0.3) bigRocks.push({ x, z, top: yc + sy * 0.9, r });
  }
  return m;
}

// --- composed rock formations -------------------------------------------------
// left: a rock cave
addStone(-2.25, -0.85, 1, { sx: 0.42, sy: 0.52, sz: 0.40, rot: 0.3 });
addStone(-1.05, -0.90, 1, { sx: 0.36, sy: 0.46, sz: 0.36, rot: 1.1 });
addStone(-1.64, -0.92, 1, { sx: 0.68, sy: 0.16, sz: 0.40, rot: 0.05, y: 0.90, overhang: true });   // roof
hideSpots.push({ x: -1.64, y: 0.46, z: -0.9, cave: true });
// right: big rock with a leaning slab and a lower companion
addStone(2.05, -0.45, 1, { sx: 0.50, sy: 0.62, sz: 0.42, rot: 0.7 });
addStone(1.20, -0.85, 1, { sx: 0.32, sy: 0.36, sz: 0.30, rot: 2.0 });
addStone(2.50, -0.98, 1, { sx: 0.30, sy: 0.55, sz: 0.28, rot: 0.4 });
hideSpots.push({ x: 1.50, y: 0.55, z: -0.42 });
// a few stones in the open, kept clear of everything else
function freeSpot(minClear, tries = 30, zr = [-IN_Z + 0.35, IN_Z - 0.3]) {
  for (let k = 0; k < tries; k++) {
    const x = rr(-IN_X + 0.4, IN_X - 0.4), z = rr(zr[0], zr[1]);
    if (obstacles.every(o => Math.hypot(o.x - x, o.z - z) > o.r + minClear)) return { x, z };
  }
  return { x: rr(-2, 2), z: rr(0.5, 1.1) };
}
for (let i = 0; i < 6; i++) { const p = freeSpot(0.35); addStone(p.x, p.z, rr(0.14, 0.24)); }
for (let i = 0; i < 9; i++) { const p = freeSpot(0.15); addStone(p.x, p.z, rr(0.05, 0.11)); }
// tiny stones tucked around the big ones
bigRocks.forEach(b => {
  for (let i = 0; i < 3; i++) {
    const a = rand() * 6.283, d = b.r * rr(0.9, 1.25);
    const x = b.x + Math.cos(a) * d, z = b.z + Math.sin(a) * d;
    if (Math.abs(x) < IN_X - 0.2 && Math.abs(z) < IN_Z - 0.2) addStone(x, z, rr(0.04, 0.09), { noObstacle: true });

function woodBranch(points, r0, r1) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const seg = 48, rad = 9;
  const g = new THREE.TubeGeometry(curve, seg, 1, rad, false);
  const pos = g.attributes.position, cols = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const ti = Math.floor(i / (rad + 1)) / seg;
    const ctr = curve.getPointAt(ti);
    const v = new THREE.Vector3().fromBufferAttribute(pos, i).sub(ctr);
    const n = Math.sin(ti * 23 + v.x * 7) * Math.cos(ti * 17 - v.z * 6);
    const rr_ = THREE.MathUtils.lerp(r0, r1, Math.pow(ti, 0.8)) * (1 + 0.16 * n);
    pos.setXYZ(i, ctr.x + v.x * rr_, ctr.y + v.y * rr_, ctr.z + v.z * rr_);
    c.setHex(0x5D4037).lerp(new THREE.Color(0x8d6e5a), 0.5 + 0.5 * n).multiplyScalar(0.85 + 0.2 * Math.sin(ti * 40));
    cols.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, woodMat);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return curve;
}

function makeSpiralShell({ turns = 4, height = 1, baseR = 0.5, tube0 = 0.05, tube1 = 0.4, flat = 1, planar = false,
                           seg = 96, ring = 10, colA, colB, bands = 3 }) {
  const pos = [], col = [], idx = [], c = new THREE.Color();
  const cAt = t => {
    const ang = t * turns * Math.PI * 2;
    const rc = baseR * (0.08 + 0.92 * Math.pow(t, planar ? 1.0 : 0.85));
    return new THREE.Vector3(Math.cos(ang) * rc, planar ? 0 : height * (1 - t), Math.sin(ang) * rc);
  };
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, ang = t * turns * Math.PI * 2;
    const ctr = cAt(t);
    const T = cAt(Math.min(1, t + 0.004)).sub(cAt(Math.max(0, t - 0.004))).normalize();
    let N = new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang));
    const B = new THREE.Vector3().crossVectors(T, N).normalize();
    N = new THREE.Vector3().crossVectors(B, T).normalize();
    const tr = tube0 + (tube1 - tube0) * Math.pow(t, 1.1);
    for (let j = 0; j <= ring; j++) {
      const ph = j / ring * Math.PI * 2;
      pos.push(
        ctr.x + (Math.cos(ph) * N.x + Math.sin(ph) * B.x * flat) * tr,
        ctr.y + (Math.cos(ph) * N.y + Math.sin(ph) * B.y * flat) * tr,
        ctr.z + (Math.cos(ph) * N.z + Math.sin(ph) * B.z * flat) * tr
      );
      const s = 0.5 + 0.5 * Math.sin(ph * bands + t * turns * 5.0);
      c.copy(colA).lerp(colB, smooth(0.45, 0.6, s)).multiplyScalar(0.8 + 0.25 * t);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < ring; j++) {
    const a = i * (ring + 1) + j, b = a + 1, cc = a + ring + 1, d = cc + 1;
    idx.push(a, cc, b, b, cc, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeScallop() {

    const ang = Math.atan2(z, x), rid = Math.cos(ang * 14);
    const k = 1 + 0.05 * rid * (1 - y * 0.6);

    c.setHex(0xF2DCC8).lerp(new THREE.Color(0xE8A98C), 0.5 + 0.5 * rid * 0.8).multiplyScalar(0.9 + 0.15 * y);
    cols.set([c.r, c.g, c.b], i * 3);

  g.computeVertexNormals();
  return g;
}

/**
 * One leaf/blade: a ribbon that starts at (x,y,z), leans outward by theta0, arches by curl and
 * is yawed around Y. aBend (sway weight) grows toward the tip; bendBase carries a parent's motion.
 */
function leafGeo(o) {
  const { len, width, profile, theta0 = 0.1, curl = 0.3, segs = 10, cols = 3, fold = 0.15, yaw = 0,
          x = 0, y = 0, z = 0, colBase, colTip, amp = len * 0.11, phase = rand() * 6.283, bendBase = 0, rib = 0.16 } = o;
  const P = [], Cc = [], Ph = [], Bd = [], I = [], pts = [];
  const cy = Math.cos(yaw), sy = Math.sin(yaw), c = new THREE.Color();
  let r = 0, yy = 0;
  for (let j = 0; j <= segs; j++) {
    const v = j / segs;
    const th = theta0 + curl * v;
    if (j > 0) { const dth = theta0 + curl * ((j - 0.5) / segs); r += Math.sin(dth) * len / segs; yy += Math.cos(dth) * len / segs; }
    const w = width * profile(v);
    const nr = Math.cos(th), ny = -Math.sin(th);
    pts.push({ x: x + r * cy, y: y + yy, z: z - r * sy });
    for (let k = 0; k < cols; k++) {
      const s = cols === 2 ? (k === 0 ? -1 : 1) : (k - 1);
      const fo = cols === 3 && s === 0 ? fold * w : 0;
      const px = r + nr * fo, py = yy + ny * fo, pz = s * w * 0.5;
      P.push(x + px * cy + pz * sy, y + py, z - px * sy + pz * cy);
      c.copy(colBase).lerp(colTip, Math.pow(v, 0.8));
      if (cols === 3 && s === 0) c.multiplyScalar(1 + rib);
      Cc.push(c.r, c.g, c.b);
      Ph.push(phase);
      Bd.push(bendBase + amp * Math.pow(v, 1.7));
    }
  }
  for (let j = 0; j < segs; j++) for (let k = 0; k < cols - 1; k++) {
    const a = j * cols + k, b = a + 1, cc = a + cols, d = cc + 1;
    I.push(a, cc, b, b, cc, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(Cc, 3));
  g.setAttribute('aPhase', new THREE.Float32BufferAttribute(Ph, 1));
  g.setAttribute('aBend', new THREE.Float32BufferAttribute(Bd, 1));
  g.setIndex(I);
  g.computeVertexNormals();
  return { geo: g, pts, phase, amp };

/* ============================================================
   Fish: a small toolkit + six species
   ============================================================ */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// body profile: [radius, axial position] control points (+Z is the nose)
function makeProfile(list) {
  const pts = new THREE.SplineCurve(list.map(([r, a]) => new THREE.Vector2(r, a))).getPoints(80)
    .map(p => new THREE.Vector2(Math.max(p.x, 0.0005), p.y));
  const R = a => {
    if (a <= pts[0].y) return pts[0].x;
    for (let i = 1; i < pts.length; i++) {
      if (a <= pts[i].y) { const p0 = pts[i - 1], p1 = pts[i]; return p0.x + (p1.x - p0.x) * (a - p0.y) / (p1.y - p0.y); }
    }
    return pts[pts.length - 1].x;
  };
  return { pts, R };
}

// colour ramp along a fin ray: vfn([base, [v, colour], ...]) -> (u, v) => Color
function vfn(stops, w = 0.025) {
  const base = col(stops[0]), rest = stops.slice(1).map(([v, c]) => [v, col(c)]);
  return (u, v) => { const c = base.clone(); for (const [at, k] of rest) c.lerp(k, smooth(at - w, at + w, v)); return c; };
}
// silver fin with dark vertical bars at given u positions
function barFin(baseHex, barHex, bars, tipHex) {
  const b = col(baseHex), k = col(barHex), t = col(tipHex || baseHex);
  return (u, v) => {
    const c = b.clone().lerp(t, smooth(0.7, 1.0, v));
    for (const [uc, hw] of bars) c.lerp(k, (1 - smooth(hw - 0.03, hw + 0.03, Math.abs(u - uc))) * (0.85 - 0.5 * v));
    return c;
  };
}

// fin: a fan between a base line and an outline; colour comes from colorFn(u, v)
function makeFin(baseFn, tipFn, colorFn, nu = 14, nv = 24) {
  const pos = [], cs = [], idx = [];
  for (let j = 0; j <= nv; j++) {
    const v = j / nv;
    for (let i = 0; i <= nu; i++) {
      const u = i / nu, b = baseFn(u), t = tipFn(u), c = colorFn(u, v);
      pos.push(b.x + (t.x - b.x) * v, b.y + (t.y - b.y) * v, b.z + (t.z - b.z) * v);
      cs.push(c.r, c.g, c.b);
    }
  }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cs, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// fin along the back (dir=+1) or belly (dir=-1); a0 -> a1 front to rear, hFn(u) = height, sweep leans it backward
const ridgeFin = (R, dir, a0, a1, hFn, sweep, colorFn, nu = 24, nv = 20, inset = 0.9) => makeFin(
  u => { const a = a0 + (a1 - a0) * u; return V3(0, dir * R(a) * inset, a); },
  u => { const a = a0 + (a1 - a0) * u, h = hFn(u); return V3(0, dir * (R(a) * inset + h), a - sweep * h); },
  colorFn, nu, nv);
// tail: fan in the YZ plane. span = half height, shape(th) = trailing distance
const tailFin = (span, shape, colorFn, nu = 18, nv = 30, root = 0.11) => makeFin(
  u => V3(0, (u - 0.5) * root, 0.05),
  u => { const th = (u - 0.5) * 2.3; return V3(0, span * Math.sin(th), -shape(th)); },
  colorFn, nu, nv);
// pectoral fin, k = size factor (1 = clownfish)
const pectoralFin = (side, k, span, colorFn) => makeFin(
  u => V3(0, 0, (0.045 - u * 0.09) * k),
  u => V3(side * span * Math.pow(Math.sin(Math.PI * (0.12 + 0.76 * u)), 0.8), (-0.03 - 0.03 * u) * k, (-0.02 - 0.17 * u) * k),
  colorFn, 12, 22);
// pelvic fin hanging from the belly
const pelvicFin = (side, len, colorFn) => makeFin(
  u => V3(0, 0, 0.03 - u * 0.07),
  u => V3(side * 0.05, -len - 0.02 * Math.sin(Math.PI * u), -0.02 - u * 0.11),
  colorFn, 8, 16);

// --- body material: species-specific colour function injected into a physical material ---
const FISH_GLSL_COMMON = /* glsl */`
varying vec3 vFishPos;
float bandf(float x, float c, float w, float s) { return 1.0 - smoothstep(w - s, w + s, abs(x - c)); }
`;
function makeBodyMaterial(name, glsl, uniforms) {
  const mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.38, clearcoat: 0.55, clearcoatRoughness: 0.25, envMapIntensity: 0.5 });
  const decl = Object.keys(uniforms).map(k => `uniform vec3 ${k};`).join('\n');
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vFishPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFishPos = position;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\n' + FISH_GLSL_COMMON + decl + '\n' + glsl)
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = fishColor(vFishPos);');
  };
  mat.customProgramCacheKey = () => 'fish-' + name;   // every species compiles its own program
  return mat;
}
const U = hexes => Object.fromEntries(Object.entries(hexes).map(([k, h]) => [k, { value: col(h) }]));

// --- shared bits for eyes / mouth / fin material ---
const finMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55, envMapIntensity: 0.35 });
const pupilMat = new THREE.MeshPhysicalMaterial({ color: 0x040404, roughness: 0.08, clearcoat: 1, envMapIntensity: 1.0 });
const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const eyeBallGeo = new THREE.SphereGeometry(0.052, 24, 18);
const pupilGeo = new THREE.SphereGeometry(0.036, 20, 14);
const glintGeo = new THREE.SphereGeometry(0.0115, 10, 8);
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x3a1408, roughness: 0.6 });
const mouthGeo = new THREE.SphereGeometry(0.03, 14, 10);

function makeEye(side, r, ballHex) {
  const g = new THREE.Group();
  const dir = new THREE.Vector3(side * 0.72, 0.10, 0.68).normalize();
  g.add(new THREE.Mesh(eyeBallGeo, new THREE.MeshPhysicalMaterial({ color: ballHex, roughness: 0.25, clearcoat: 1, envMapIntensity: 0.8 })));
  const pupil = new THREE.Mesh(pupilGeo, pupilMat);
  pupil.position.copy(dir).multiplyScalar(0.026);
  g.add(pupil);
  const glint = new THREE.Mesh(glintGeo, glintMat);
  glint.position.set(side * 0.62, 0.55, 0.56).normalize().multiplyScalar(0.058);
  glint.position.add(pupil.position.clone().multiplyScalar(0.35));
  g.add(glint);
  g.scale.setScalar(r / 0.052);
  return g;
}

/** Build a fish model from a species spec. */
function assemble(S) {
  const prof = makeProfile(S.profile);
  const geo = new THREE.LatheGeometry(prof.pts, 56);
  geo.rotateX(Math.PI / 2);
  geo.scale(S.xs, S.ys, 1);
  geo.computeVertexNormals();
  const R = a => prof.R(a) * S.ys;
  const halfW = (a, y) => S.xs * Math.sqrt(Math.max(prof.R(a) ** 2 - (y / S.ys) ** 2, 0));

  const root = new THREE.Group(), roll = new THREE.Group(), bodyGroup = new THREE.Group();
  root.add(roll); roll.add(bodyGroup);
  const body = new THREE.Mesh(geo, makeBodyMaterial(S.name, S.glsl, U(S.colors)));
  body.castShadow = true;
  bodyGroup.add(body);

  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, 0, S.tail.z);
  const tail = new THREE.Mesh(S.tail.geo(), finMat);
  tail.castShadow = true;
  tailPivot.add(tail);
  bodyGroup.add(tailPivot);

  const dorsal = new THREE.Mesh(S.dorsal(R), finMat), anal = new THREE.Mesh(S.anal(R), finMat);
  bodyGroup.add(dorsal, anal);

  const pecL = new THREE.Group(), pecR = new THREE.Group();
  for (const [grp, side] of [[pecL, 1], [pecR, -1]]) {
    grp.position.set(side * halfW(S.pec.a, S.pec.y) * 0.96, S.pec.y, S.pec.a);
    grp.add(new THREE.Mesh(S.pec.geo(side), finMat));
    bodyGroup.add(grp);
  }
  if (S.pelvic) for (const side of [-1, 1]) {
    const pv = new THREE.Mesh(S.pelvic.geo(side), finMat);
    pv.position.set(side * halfW(S.pelvic.a, -R(S.pelvic.a) * 0.9) * 0.9, -R(S.pelvic.a) * 0.9, S.pelvic.a);
    bodyGroup.add(pv);
  }
  for (const side of [-1, 1]) {
    const eye = makeEye(side, S.eye.r, S.eye.ball);
    eye.position.set(side * halfW(S.eye.a, S.eye.y) * 0.93, S.eye.y, S.eye.a);
    bodyGroup.add(eye);
  }
  const mouth = new THREE.Mesh(mouthGeo, mouthMat);
  mouth.position.set(0, S.mouth.y, S.mouth.a);
  mouth.scale.set(...S.mouth.s);
  bodyGroup.add(mouth);
  return { root, roll, bodyGroup, tailPivot, dorsal, anal, pecL, pecR };
}

/* ---------- swimming agent ---------- */
const LIM_X = IN_X - 0.3, LIM_Z = IN_Z - 0.3;
const UP = new THREE.Vector3(0, 1, 0), ZERO = new THREE.Vector3();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion();
const _f0 = new THREE.Vector3(), _f1 = new THREE.Vector3(), _d = new THREE.Vector3(), _t = new THREE.Vector3();

class FishAgent {
  constructor(spec, sizeMul, start) {
    this.spec = spec; this.beh = spec.beh; this.anim = spec.anim;
    this.size = spec.scale * sizeMul;
    this.model = assemble(spec);
    this.model.root.scale.setScalar(this.size);
    this.ymin = 0.28 + spec.ext.hb * this.size;
    this.ymax = WATER_Y - 0.28 - spec.ext.ht * this.size;
    this.pos = start.clone();
    this.quat = new THREE.Quaternion();
    this.target = new THREE.Vector3();
    this.hugging = false;
    this.mode = 'go'; this.hoverT = 0; this.hoverK = 1;
    this.expire = 0;
    this.phase = rand() * 10;
    this.wagPhase = rand() * 6.28;
    this.bank = 0;
    this.speed = this.beh.speed;
    this.pickTarget(0);
    _m.lookAt(_d.copy(this.target).sub(this.pos).normalize(), ZERO, UP);
    this.quat.setFromRotationMatrix(_m);
    this.apply();
  }
  pickTarget(t) {
    const b = this.beh;
    this.hugging = false;
    if (rand() < b.hug) {
      // somewhere with cover: a hiding place, or beside one of the big rocks
      if (rand() < 0.6 && hideSpots.length) {
        const h = hideSpots[Math.floor(rand() * hideSpots.length)];
        this.target.set(h.x, Math.max(h.y, this.ymin), h.z);
        this.hugging = true;
      } else if (bigRocks.length) {
        const r = bigRocks[Math.floor(rand() * bigRocks.length)], a = rand() * 6.283, d = r.r + rr(0.25, 0.55);
        const x = clamp(r.x + Math.cos(a) * d, -LIM_X + 0.6, LIM_X - 0.6), z = clamp(r.z + Math.sin(a) * d, -LIM_Z + 0.2, LIM_Z - 0.2);
        this.target.set(x, clamp(groundY(x, z) + rr(0.3, 0.75), this.ymin, this.ymax), z);
      }
    } else {
      for (let k = 0; k < 10; k++) {
        this.target.set(rr(-(LIM_X - 0.9), LIM_X - 0.9), THREE.MathUtils.lerp(this.ymin, this.ymax, rr(b.y[0], b.y[1])), rr(-(LIM_Z - 0.3), LIM_Z - 0.3));
        if (this.target.distanceTo(this.pos) > b.minWp) break;
      }
    }
    this.expire = t + rr(b.wpT[0], b.wpT[1]);
  }
  update(dt, t, others) {
    const b = this.beh, A = this.anim, size = this.size, ext = this.spec.ext;
    const fwd = _f0.set(0, 0, 1).applyQuaternion(this.quat);

    _d.copy(this.target).sub(this.pos);
    const dist = _d.length();
    if (this.mode === 'go') {
      if (dist < (this.hugging ? 0.35 : 0.6) || t > this.expire) {
        if (rand() < b.pause) { this.mode = 'hover'; this.hoverT = rr(b.pauseT[0], b.pauseT[1]); }
        else this.pickTarget(t);
      }
    } else {
      this.hoverT -= dt;
      if (this.hoverT <= 0) { this.mode = 'go'; this.pickTarget(t); }
    }
    _d.normalize();

    // keep clear of other fish
    for (const o of others) {
      if (o === this) continue;
      _t.copy(this.pos).sub(o.pos);
      const l = _t.length(), R = (b.sep + o.beh.sep) * 0.5;
      if (l < R && l > 0.001) _d.addScaledVector(_t, (R - l) / l * 1.6);
    }
    // steer around big rocks unless heading for cover next to them
    if (dist > 0.9) for (const r of bigRocks) {
      const dx = this.pos.x - r.x, dz = this.pos.z - r.z, l = Math.hypot(dx, dz), lim = r.r + 0.45 + size * 0.3;
      if (l < lim && this.pos.y < r.top + 0.3) { _d.x += dx / l * (lim - l) * 2.2; _d.z += dz / l * (lim - l) * 2.2; _d.y += 0.5; }
    }
    // soft wall avoidance, from the nose position
    _t.copy(this.pos).addScaledVector(fwd, ext.nose * size + 0.35);
    const soft = 0.7;
    if (_t.x >  LIM_X - soft) _d.x -= (_t.x - (LIM_X - soft)) * 2.0;
    if (_t.x < -LIM_X + soft) _d.x += (-LIM_X + soft - _t.x) * 2.0;
    if (_t.z >  LIM_Z - soft) _d.z -= (_t.z - (LIM_Z - soft)) * 2.5;
    if (_t.z < -LIM_Z + soft) _d.z += (-LIM_Z + soft - _t.z) * 2.5;
    if (_t.y > this.ymax - soft * 0.6) _d.y -= (_t.y - (this.ymax - soft * 0.6)) * 2.0;
    if (_t.y < this.ymin + soft * 0.6) _d.y += (this.ymin + soft * 0.6 - _t.y) * 2.0;
    _d.y = clamp(_d.y, -0.45, 0.45);
    _d.normalize();

    // smooth turn toward the wanted heading, at this species' own agility
    _m.lookAt(_d, ZERO, UP);
    _q.setFromRotationMatrix(_m);
    const ang = this.quat.angleTo(_q);
    const step = Math.min(ang * (1 - Math.exp(-b.turnK * dt)), b.turn * dt);
    if (ang > 1e-5) this.quat.rotateTowards(_q, step);
    this.quat.normalize();
    const fwd1 = _f1.set(0, 0, 1).applyQuaternion(this.quat);

    // banking from yaw rate
    const yawRate = _t.crossVectors(fwd, fwd1).y / Math.max(dt, 1e-4);
    const bankTarget = clamp(-yawRate * b.bank, -0.55, 0.55);
    this.bank += (bankTarget - this.bank) * (1 - Math.exp(-4 * dt));

    // speed: species pace, own rhythm, slower in tight turns, near-still while hovering
    this.hoverK += ((this.mode === 'hover' ? 0.05 : 1) - this.hoverK) * (1 - Math.exp(-2.2 * dt));
    let sp = b.speed * (0.85 + 0.3 * Math.sin(t * 0.6 + this.phase)) * clamp(0.4 + 0.6 * fwd1.dot(_d), 0.4, 1) * this.hoverK;
    if (b.pulse) sp *= 1 - b.pulse.a * (0.5 + 0.5 * Math.sin(t * b.pulse.f * 6.283 + this.phase));   // stop-and-go
    this.speed = sp;
    this.pos.addScaledVector(fwd1, sp * dt);
    this.pos.y += Math.sin(t * 1.3 + this.phase) * b.bob * dt;

    // hard limits: nose/tail inside the glass, above the gravel and rocks
    for (const k of [ext.nose * size, ext.tail * size, 0]) {
      _t.copy(this.pos).addScaledVector(fwd1, k);
      if (_t.x >  LIM_X) this.pos.x -= _t.x - LIM_X;
      if (_t.x < -LIM_X) this.pos.x -= _t.x + LIM_X;
      if (_t.z >  LIM_Z) this.pos.z -= _t.z - LIM_Z;
      if (_t.z < -LIM_Z) this.pos.z -= _t.z + LIM_Z;
      const floor = groundY(_t.x, _t.z) + 0.06 + ext.hb * size * 0.75;
      if (_t.y < floor) this.pos.y += floor - _t.y;
      if (_t.y > this.ymax + 0.15) this.pos.y -= _t.y - (this.ymax + 0.15);
    }

    // animation: tail beat scales with speed; tangs row with their pectorals
    this.wagPhase += dt * (A.wagBase + A.wagGain * this.speed);
    const w = Math.sin(this.wagPhase), m = this.model;
    const turnBoost = 1 + Math.min(Math.abs(yawRate) * 0.5, 0.5);
    m.tailPivot.rotation.y = w * A.tail * turnBoost;
    m.bodyGroup.rotation.y = -w * A.body;
    m.dorsal.rotation.z = Math.sin(t * 2.1 + this.phase) * A.dorsal;
    m.anal.rotation.z = Math.sin(t * 2.4 + this.phase + 1.0) * A.anal;
    const flap = Math.sin(t * A.pecFreq + this.phase);
    m.pecL.rotation.set(0, -0.15 + flap * A.pec, -0.10 + flap * A.pec * 0.73);
    m.pecR.rotation.set(0,  0.15 - flap * A.pec,  0.10 - flap * A.pec * 0.73);
    m.roll.rotation.z = this.bank;
    this.apply();
  }
  apply() {
    this.model.root.position.copy(this.pos);
    this.model.root.quaternion.copy(this.quat);
  }
}

/* ============================================================
   Bottom dwellers: crabs, a crayfish and snails
   ============================================================ */
const wrapAng = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function crustMat(hex, vertexColors = false) {
  const m = new THREE.MeshPhysicalMaterial({ color: hex, vertexColors, roughness: 0.55, clearcoat: 0.35, clearcoatRoughness: 0.4, envMapIntensity: 0.4 });
  addCaustics(m, 0.8);
  return m;
}
const eyeBlack = new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.1, clearcoat: 1, envMapIntensity: 1.0 });

// cylinder from the origin along +x (or +z), thicker at the base
function limbGeo(len, r0, r1, axis = 'x') {
  const g = new THREE.CylinderGeometry(r1, r0, len, 7, 1);
  g.translate(0, len / 2, 0);
  if (axis === 'x') g.rotateZ(-Math.PI / 2); else if (axis === 'z') g.rotateX(Math.PI / 2);
  return g;
}
function coneGeoZ(len, r) { const g = new THREE.ConeGeometry(r, len, 8); g.rotateX(Math.PI / 2); g.translate(0, 0, len / 2); return g; }

function makeLeg(mat, L1, L2, r, upAng, downAng) {
  const root = new THREE.Group();
  const up = new THREE.Mesh(limbGeo(L1, r, r * 0.75), mat); up.rotation.z = upAng; root.add(up);
  const knee = new THREE.Group(); knee.position.set(Math.cos(upAng) * L1, Math.sin(upAng) * L1, 0); root.add(knee);
  const low = new THREE.Mesh(limbGeo(L2, r * 0.75, r * 0.3), mat); low.rotation.z = -downAng; knee.add(low);
  root.userData = { up, knee, upAng };
  return root;
}

/* ---- walkers ---- */
const _up = new THREE.Vector3(), _rt = new THREE.Vector3(), _fw = new THREE.Vector3(), _bm = new THREE.Matrix4();

class GroundCrawler {
  constructor(model, o) {
    this.model = model;
    Object.assign(this, { speed: 0.1, turn: 1.2, sideways: false, hideProb: 0, rockProb: 0, pauseT: [2, 6], legHz: 7, clear: 0.16, avoid: true, maxWalk: 30, lift: 0 }, o);
    this.h = rand() * 6.283; this.yaw = this.h; this.side = 1;
    this.state = 'pause'; this.timer = rr(0.5, 3); this.walkT = 0;
    this.phase = 0; this.move = 0; this.pitch = 0; this.roll = 0; this.ph = rand() * 6.28;
    this.tx = this.x; this.tz = this.z;
    model.rotation.order = 'YXZ';
    scene.add(model);
    this.place(0);
  }
  pickTarget() {
    let tx = this.x, tz = this.z;
    if (rand() < this.hideProb && hideSpots.length) {
      const h = hideSpots[Math.floor(rand() * hideSpots.length)]; tx = h.x; tz = h.z;
    } else if (rand() < this.rockProb && bigRocks.length) {
      const r = bigRocks[Math.floor(rand() * bigRocks.length)], a = rand() * 6.283, d = rand() * r.r * 0.7;
      tx = r.x + Math.cos(a) * d; tz = r.z + Math.sin(a) * d;
    } else {
      for (let k = 0; k < 12; k++) {
        const x = rr(-IN_X + 0.4, IN_X - 0.4), z = rr(-IN_Z + 0.35, IN_Z - 0.3);
        tx = x; tz = z;
        if (Math.hypot(x - this.x, z - this.z) > 0.6 && (!this.avoid || obstacles.every(o => Math.hypot(o.x - x, o.z - z) > o.r + 0.12))) break;
      }
    }
    this.tx = tx; this.tz = tz;
    if (this.sideways) {                       // walk sideways, leading with whichever flank needs the smaller turn
      const aim = Math.atan2(tx - this.x, tz - this.z);
      const d1 = Math.abs(wrapAng(aim - Math.PI / 2 - this.yaw)), d2 = Math.abs(wrapAng(aim + Math.PI / 2 - this.yaw));
      this.side = d1 <= d2 ? 1 : -1;
    }
  }
  update(dt, t) {
    if (this.state === 'pause') {
      this.timer -= dt;
      this.move += (0 - this.move) * (1 - Math.exp(-4 * dt));
      if (this.timer <= 0) { this.pickTarget(); this.state = 'walk'; this.walkT = 0; }
    } else {
      this.walkT += dt;
      const dx = this.tx - this.x, dz = this.tz - this.z, dist = Math.hypot(dx, dz);
      if (dist < 0.08 || this.walkT > this.maxWalk) { this.state = 'pause'; this.timer = rr(this.pauseT[0], this.pauseT[1]); }
      else {
        let vx = dx / dist, vz = dz / dist;
        if (this.avoid) for (const ob of obstacles) {
          const ox = this.x - ob.x, oz = this.z - ob.z, d = Math.hypot(ox, oz), lim = ob.r + this.clear;
          if (d < lim && d > 1e-4 && Math.hypot(ob.x - this.tx, ob.z - this.tz) > ob.r + 0.5) { vx += ox / d * (lim - d) / this.clear * 1.8; vz += oz / d * (lim - d) / this.clear * 1.8; }
        }
        const diff = wrapAng(Math.atan2(vx, vz) - this.h);
        this.h += clamp(diff, -this.turn * dt, this.turn * dt);
        const sp = this.speed * clamp(1 - Math.abs(diff) / 1.3, 0.15, 1) * (0.85 + 0.3 * Math.sin(t * 0.9 + this.ph));
        this.move += (1 - this.move) * (1 - Math.exp(-3 * dt));
        this.x += Math.sin(this.h) * sp * dt; this.z += Math.cos(this.h) * sp * dt;
        this.phase += dt * this.legHz * (sp / this.speed);
        const lx = IN_X - 0.3, lz = IN_Z - 0.3;
        if (Math.abs(this.x) > lx || Math.abs(this.z) > lz) {
          this.x = clamp(this.x, -lx, lx); this.z = clamp(this.z, -lz, lz);
          this.state = 'pause'; this.timer = rr(0.5, 1.5);
        }
      }
    }
    this.place(dt);
    this.model.userData.animate(this.phase, this.move, t);
  }
  place(dt) {
    const target = this.sideways ? this.h - this.side * Math.PI / 2 : this.h;
    this.yaw += wrapAng(target - this.yaw) * (dt ? 1 - Math.exp(-5 * dt) : 1);
    const s = Math.sin(this.yaw), c = Math.cos(this.yaw), e = 0.09;
    const gy = groundY(this.x, this.z);
    const hF = groundY(this.x + s * e, this.z + c * e), hB = groundY(this.x - s * e, this.z - c * e);
    const hR = groundY(this.x + c * e, this.z - s * e), hL = groundY(this.x - c * e, this.z + s * e);
    const k = dt ? 1 - Math.exp(-6 * dt) : 1;
    this.pitch += (-Math.atan2(hF - hB, 2 * e) - this.pitch) * k;
    this.roll += (Math.atan2(hR - hL, 2 * e) - this.roll) * k;
    this.model.position.set(this.x, gy + this.lift, this.z);
    this.model.rotation.set(this.pitch, this.yaw, this.roll);
  }
}

// snail crawling on one of the four inner glass faces
const GLASS = [
  { n: [0, 0, -1], eu: [1, 0, 0], o: [0, 0, IN_Z],  half: IN_X - 0.25 },   // front
  { n: [0, 0, 1],  eu: [1, 0, 0], o: [0, 0, -IN_Z], half: IN_X - 0.25 },   // back
  { n: [1, 0, 0],  eu: [0, 0, 1], o: [-IN_X, 0, 0], half: IN_Z - 0.2 },    // left
  { n: [-1, 0, 0], eu: [0, 0, 1], o: [IN_X, 0, 0],  half: IN_Z - 0.2 },    // right
];
class GlassSnail {
  constructor(model, panel, speed) {
    this.model = model; this.g = GLASS[panel]; this.speed = speed;
    this.u = rr(-this.g.half * 0.7, this.g.half * 0.7); this.v = rr(0.7, WATER_Y - 0.6);
    this.th = rand() * 6.283; this.ph = rand() * 6.28; this.phase = 0; this.move = 1;
    scene.add(model);
    this.update(0, 0);
  }
  update(dt, t) {
    const g = this.g, vMin = 0.4, vMax = WATER_Y - 0.3;
    // slow, meandering heading; pauses now and then
    const going = Math.sin(t * 0.11 + this.ph * 3) > -0.55;
    this.th += Math.sin(t * 0.17 + this.ph) * 0.35 * dt;
    const sp = going ? this.speed * (0.7 + 0.3 * Math.sin(t * 0.5 + this.ph)) : 0;
    this.u += Math.cos(this.th) * sp * dt; this.v += Math.sin(this.th) * sp * dt;
    if (this.u > g.half)  { this.u = g.half;  this.th = Math.PI - this.th; }
    if (this.u < -g.half) { this.u = -g.half; this.th = Math.PI - this.th; }
    if (this.v > vMax)    { this.v = vMax;    this.th = -this.th; }
    if (this.v < vMin)    { this.v = vMin;    this.th = -this.th; }
    this.move += ((going ? 1 : 0) - this.move) * (1 - Math.exp(-2 * dt));
    this.phase += dt * 2.5 * (sp / this.speed || 0);
    _up.set(...g.n);
    _rt.set(...g.eu);
    _fw.copy(_rt).multiplyScalar(Math.cos(this.th)).addScaledVector(UP, Math.sin(this.th)).normalize();
    _rt.crossVectors(_up, _fw).normalize();
    _bm.makeBasis(_rt, _up, _fw);
    this.model.quaternion.setFromRotationMatrix(_bm);
    this.model.position.set(g.o[0], g.o[1], g.o[2])
      .addScaledVector(new THREE.Vector3(...g.eu), this.u).addScaledVector(UP, this.v).addScaledVector(_up, 0.004);
    this.model.userData.animate(this.phase, this.move, t);
  }
}

  crawlers.push(new GlassSnail(makeSnail({ shell: 'cone', bodyHex: 0x9c8b73, colA: col(0xB98F5A), colB: col(0x3a2414), size: 0.15 }), 0, 0.028));
  crawlers.push(new GlassSnail(makeSnail({ shell: 'ram', bodyHex: 0x7b5138, colA: col(0xC1541C), colB: col(0x6b2a10), size: 0.14 }), 1, 0.03));
  crawlers.push(new GlassSnail(makeSnail({ shell: 'apple', bodyHex: 0xCDBB90, colA: col(0xD9A82E), colB: col(0x5f4a15), size: 0.17 }), 2, 0.03));
}

/* ============================================================
   Bubbles
   ============================================================ */
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0, metalness: 0,
  transmission: 0.95, thickness: 0.05, ior: 1.33,
  iridescence: 1, iridescenceIOR: 1.3, iridescenceThicknessRange: [100, 420],
  transparent: true, opacity: 0.6, envMapIntensity: 2.5, depthWrite: false,
});
const bubbleGeo = new THREE.SphereGeometry(1, 16, 12);
const streams = [
  { x: -2.55, z: 0.05, rate: 3.2, acc: 0 },
  { x:  2.45, z: 0.05, rate: 2.4, acc: 0 },
];
// little air stones where the bubbles come from
const airStoneMat = new THREE.MeshStandardMaterial({ color: 0x777b80, roughness: 0.9, envMapIntensity: 0.2 });
streams.forEach(s => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.07, 14), airStoneMat);
  m.position.set(s.x, terrain(s.x, s.z) + 0.02, s.z);
  m.castShadow = true;
  scene.add(m);
  s.y0 = terrain(s.x, s.z) + 0.08;
});

const BUBBLE_POOL = 70;
const bubbles = [];
for (let i = 0; i < BUBBLE_POOL; i++) {
  const mesh = new THREE.Mesh(bubbleGeo, bubbleMat);
  mesh.visible = false;
  mesh.renderOrder = 7;
  scene.add(mesh);
  bubbles.push({ mesh, active: false, x0: 0, z0: 0, y: 0, y0: 0, r: 0.05, vy: 0.6, ph: 0, wob: 0.03 });
}
function spawnBubble(s) {
  const b = bubbles.find(bb => !bb.active);
  if (!b) return;
  b.active = true;
  b.x0 = s.x + rr(-0.03, 0.03); b.z0 = s.z + rr(-0.03, 0.03);
  b.y = b.y0 = s.y0;
  b.r = rr(0.028, 0.07);
  b.vy = 0.42 + b.r * 4.0 + rr(0, 0.1);
  b.ph = rand() * 6.28;
  b.wob = rr(0.02, 0.05);
  b.mesh.visible = true;
}
function updateBubbles(dt, t) {
  for (const s of streams) {
    s.acc += s.rate * dt * (0.7 + 0.6 * rand());
    while (s.acc >= 1) { s.acc -= 1; spawnBubble(s); }
  }
  for (const b of bubbles) {
    if (!b.active) continue;
    b.y += b.vy * dt;
    if (b.y >= WATER_Y - 0.04) { b.active = false; b.mesh.visible = false; continue; }
    const rise = (b.y - b.y0) / (WATER_Y - b.y0);
    const wob = b.wob * (0.4 + rise * 1.4);
    b.mesh.position.set(
      b.x0 + Math.sin(t * 4.2 + b.ph) * wob,
      b.y,
      b.z0 + Math.cos(t * 3.4 + b.ph * 1.3) * wob
    );
    b.mesh.scale.setScalar(b.r * (1 - 0.4 * smooth(0.55, 1.0, rise)));
  }
}

/* ============================================================
   Resize, hint, animation loop
   ============================================================ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  particleScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
window.addEventListener('resize', onResize);
onResize();

const hint = document.getElementById('hint');
const hideHint = () => hint.classList.add('hidden');
renderer.domElement.addEventListener('pointerdown', hideHint, { once: true });
setTimeout(hideHint, 9000);

// debug: #warm=SECONDS pre-steps the simulation (used for headless screenshots)
{
  const m = /warm=([\d.]+)/.exec(location.hash);
  if (m) for (let w = 0; w < parseFloat(m[1]); w += 1 / 30) {
    const t = (timeU.value += 1 / 30);
    for (const a of agents) a.update(1 / 30, t, agents);
    for (const c of crawlers) c.update(1 / 30, t);
    updateBubbles(1 / 30, t);
  }
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = (timeU.value += dt);

  for (const a of agents) a.update(dt, t, agents);
  for (const c of crawlers) c.update(dt, t);
  updateBubbles(dt, t);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// small hook for automated screenshots / debugging
window.__aquarium = { scene, camera, controls, agents, crawlers, renderer, bubbles, streams };
</script>
